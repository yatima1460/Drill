[workspace]
members = ["crates/drill-core", "crates/drill-query", "crates/drill-macos", "crates/drill-windows"]
exclude = ["vendor/eframe", "vendor/file_icon_provider"]
resolver = "2"

[patch.crates-io]
eframe = { path = "vendor/eframe" }
file_icon_provider = { path = "vendor/file_icon_provider" }

[package]
name = "drill"
version = "2.0.0"
edition = "2021"
description = "Fast file search without indexing"
license-file = "LICENSE"

[profile.release]
opt-level = 3
lto = "off"

[features]
ui-test-driver = []

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
drill-core = { path = "crates/drill-core" }
wasmi = { version = "0.51.3", default-features = false, features = ["std", "extra-checks"] }
unicode-segmentation = "1.13.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.19.0"
gio-unix = "0.22"

[target.'cfg(not(target_os = "macos"))'.dependencies]
file_icon_provider = "1.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
drill-macos = { path = "crates/drill-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
muda = { version = "0.21.2", default-features = false }
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Storage_FileSystem"] }
