[workspace]
members = ["crates/drill-core", "crates/drill-query", "crates/drill-icons", "crates/drill-desktop", "crates/drill-gtk", "crates/drill-windows", "crates/drill-swift"]
resolver = "2"

[package]
name = "drill"
version = "2.0.0"
edition = "2021"
description = "Fast file search without indexing"
license-file = "LICENSE"

[profile.release]
opt-level = 3
lto = "off"

[features]
verify-packaged-appimage = ["dep:image"]

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
drill-desktop = { path = "crates/drill-desktop" }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
drill-icons = { path = "crates/drill-icons" }
