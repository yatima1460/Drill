[package]
name = "drill"
version = "1.0.0"
edition = "2021"
description = "Fast file search without indexing"
license-file = "LICENSE"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
unicode-normalization = "0.1.25"
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["png"] }
