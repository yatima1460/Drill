[workspace]
members = ["crates/drill-core"]
resolver = "2"

[package]
name = "drill"
version = "2.0.0"
edition = "2021"
description = "Fast file search without indexing"
license-file = "LICENSE"

[features]
ui-test-driver = []

[dev-dependencies]
enigo = "0.6.1"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
drill-core = { path = "crates/drill-core" }
chrono = "0.4.45"
file_icon_provider = "1.0.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
