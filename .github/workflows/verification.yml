name: Rust verification
on:
  pull_request:
    paths:
      - '.github/workflows/verification.yml'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'build.rs'
      - 'Makefile'
      - 'scripts/test-mutants.sh'
      - 'verification/tools.env'
      # cargo-mutants runs the unmodified tests in each package before mutating.
      - 'src/**'
      - 'tests/**'
      - 'crates/drill-core/**'
      - 'vendor/**'
      - 'tools/appimage-icon-wasm/**'
      - 'tools/exe-icon-wasm/**'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      scope:
        description: Package to mutate
        type: choice
        options: [core, desktop, guest, appimage]
      platform:
        description: Native test platform
        type: choice
        options: [linux, macos, windows]
      shard:
        description: Zero-based shard (e.g. 0/32), or 0/1 for every candidate
        type: string
        default: '0/32'
permissions:
  contents: read
jobs:
  mutations:
    runs-on: ${{ inputs.platform == 'macos' && 'macos-15' || inputs.platform == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux' && (github.event_name == 'pull_request' || inputs.scope == 'desktop')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev libxkbcommon-x11-0 libx11-xcb1 libegl1
      - name: Install pinned cargo-mutants
        run: |
          source verification/tools.env
          cargo install --locked --version "$MUTANTS_VERSION" cargo-mutants
      - name: Test focused mutations in all first-party packages
        if: github.event_name == 'pull_request'
        run: make test-mutants
      - name: Run requested mutation campaign
        if: github.event_name == 'workflow_dispatch'
        env:
          SCOPE: ${{ inputs.scope }}
          MUTATION_SHARD: ${{ inputs.shard }}
        run: scripts/test-mutants.sh "$SCOPE" full
      - name: Preserve mutation outcomes, diffs and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results-${{ runner.os }}
          path: target/mutations/
          if-no-files-found: warn
