name: Windows system search
on:
  pull_request:
    paths:
      - '.github/workflows/windows-search.yml'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/assets/drill.ico'
      - 'src/assets/drill.rc'
      - 'src/assets/drill.manifest'
      - '.github/ci/windows_resource_smoke.py'
      - 'rust-toolchain.toml'
      - 'crates/drill-core/**'
      - 'crates/drill-query/**'
      - 'crates/drill-windows/**'
      - 'crates/drill-desktop/**'
      - 'crates/drill-icons/**'
      - 'tests/native_ui/fixtures/mac-bundles/**'
      - 'src/assets/exe-icon.wasm'
      - 'src/assets/appimage-icon.wasm'
      - 'src/assets/drill-macos.png'
      # drill-core embeds all three root lists and the dictionary at compile time.
      - 'src/assets/roots_*.txt'
      - 'src/assets/wordsalpha.txt'
      - 'src/main.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notepad:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - name: Link the Windows SDK resource and check every Explorer icon frame
        run: python .github/ci/windows_resource_smoke.py
      - name: Link and run standalone Windows adapter tests with all features on MSVC
        run: cargo test --locked --no-fail-fast -p drill-windows -p drill-icons --all-features
      - name: Read bundle artwork directly from the hosted Windows checkout
        run: |
          $testName = 'bundle::platform::tests::decodes_carmine_from_the_checked_out_repository'
          cargo test --locked -p drill-icons --all-features --lib $testName -- --ignored --exact | Tee-Object -Variable testOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($testOutput -cnotcontains "test $testName ... ok") {
            throw "Expected $testName to run and pass"
          }
      - name: Verify Unicode text, PNG and DIB on the hosted Windows clipboard
        run: cargo test --locked -p drill-windows --features shell-icons,clipboard --test clipboard -- --ignored --test-threads=1
      - name: Test Windows directory priority, traversal and tool discovery
        run: cargo test --locked -p drill-core
      - name: Measure Windows startup and verify the installed Notepad executable
        run: cargo test --locked -p drill-core windows_startup -- --ignored --nocapture --test-threads=1
