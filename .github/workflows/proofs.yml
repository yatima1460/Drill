name: Rust proofs
on:
  pull_request:
    paths:
      - '.github/workflows/proofs.yml'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - 'verification/**'
      # Modules imported directly by verification/proofs.rs.
      - 'crates/drill-core/src/file_filter.rs'
      - 'src/result_order.rs'
      - 'tools/appimage-icon-wasm/src/bounds.rs'
      - 'tools/exe-icon-wasm/src/resource.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Kani
        run: |
          source verification/tools.env
          cargo install --locked --version "$KANI_VERSION" kani-verifier
          cargo kani setup
      - run: cargo fmt --manifest-path verification/Cargo.toml -- --check
      - run: make prove
