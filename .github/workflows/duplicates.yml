name: Duplicate code
on:
  pull_request:
  push:
    branches: [main]
    # The build workflow calls this check for production inputs on main.
    paths:
      - '**'
      - '!src/**'
      - '!crates/**'
      - '!vendor/**'
      - '!Cargo.toml'
      - '!Cargo.lock'
      - '!build.rs'
      - '!rust-toolchain.toml'
      - '!LICENSE'
      - '!scripts/package-linux.sh'
      - '!scripts/package-macos.sh'
      - '!scripts/sign-macos.sh'
      - '**/*.md'
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jscpd:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for duplicate code
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output jscpd.tar.gz https://github.com/kucherenko/jscpd/releases/download/v5.4.3/jscpd-linux-x64-gnu.tar.gz
          echo 'a19d719331b21a047a7537f982566dabcf6d6e5f51581c3b80d9c420979cc92c  jscpd.tar.gz' | sha256sum --check
          tar -xzf jscpd.tar.gz jscpd
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/jscpd" .
