name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platforms:
    name: Select checks for changed files
    runs-on: ubuntu-24.04
    outputs:
      duplicates: ${{ steps.select.outputs.duplicates }}
      linux: ${{ steps.select.outputs.linux }}
      windows: ${{ steps.select.outputs.windows }}
      macos: ${{ steps.select.outputs.macos }}
      macos_legacy: ${{ steps.select.outputs.macos_legacy }}
      release: ${{ steps.select.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B -m unittest discover -s .github/ci
      - id: select
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/ci/test_platforms.py
          python3 .github/ci/platforms.py
  jscpd:
    needs: platforms
    if: needs.platforms.outputs.duplicates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      JSCPD_VERSION: 5.4.3
      JSCPD_SHA256: a19d719331b21a047a7537f982566dabcf6d6e5f51581c3b80d9c420979cc92c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore jscpd release archive
        id: archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jscpd.tar.gz
          key: jscpd-${{ runner.os }}-${{ runner.arch }}-${{ env.JSCPD_VERSION }}-${{ env.JSCPD_SHA256 }}
      - name: Verify and extract jscpd
        env:
          CACHE_HIT: ${{ steps.archive.outputs.cache-hit }}
        run: |
          url="https://github.com/kucherenko/jscpd/releases/download/v${JSCPD_VERSION}/jscpd-linux-x64-gnu.tar.gz"
          bash .github/ci/prepare-jscpd.sh "$RUNNER_TEMP" "$CACHE_HIT" "$url"
      - name: Check for duplicate code
        run: '"$RUNNER_TEMP/jscpd" .'
      - name: Test offline reuse and rejection of bad inputs
        run: bash .github/ci/test-jscpd-cache.sh
      - name: Save verified jscpd release archive
        if: >-
          github.repository == 'yatima1460/Drill' && github.event_name == 'push' &&
          github.ref == 'refs/heads/main' && steps.archive.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jscpd.tar.gz
          key: ${{ steps.archive.outputs.cache-primary-key }}
  linux:
    needs: platforms
    if: needs.platforms.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev libxkbcommon-x11-0 libx11-xcb1 libegl1 xdg-utils shellcheck zstd xvfb xauth openbox xdotool
      - name: Lint shell scripts before release packaging
        if: needs.platforms.outputs.release == 'true'
        run: make shellcheck
      - name: Verify isolated icon decoder
        run: |
          cargo fmt --manifest-path tools/exe-icon-wasm/Cargo.toml -- --check
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/registry/src=/cargo/registry/src --remap-path-prefix=$PWD=/workspace"
          cargo build --manifest-path tools/exe-icon-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked
          cmp src/assets/exe-icon.wasm tools/exe-icon-wasm/target/wasm32-unknown-unknown/release/drill_exe_icon_wasm.wasm
      - name: Preserve decoder rebuild on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-rebuild
          path: tools/exe-icon-wasm/target/wasm32-unknown-unknown/release/drill_exe_icon_wasm.wasm
          if-no-files-found: ignore
      - name: Verify isolated AppImage decoder
        run: |
          cargo fmt --manifest-path tools/appimage-icon-wasm/Cargo.toml -- --check
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/registry/src=/cargo/registry/src --remap-path-prefix=$PWD=/workspace"
          cargo build --manifest-path tools/appimage-icon-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked
          cmp src/assets/appimage-icon.wasm tools/appimage-icon-wasm/target/wasm32-unknown-unknown/release/drill_appimage_icon_wasm.wasm
      - name: Preserve AppImage decoder rebuild on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-decoder-rebuild
          path: tools/appimage-icon-wasm/target/wasm32-unknown-unknown/release/drill_appimage_icon_wasm.wasm
          if-no-files-found: ignore
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks
      - run: cargo test --locked --workspace
      - name: Native UI test on a virtual X display
        run: xvfb-run -a scripts/test-native-ui-linux.sh
      - run: cargo build --release --locked
      - run: target/release/drill --version
      - run: scripts/package-linux.sh
      - name: Decode the icon from the packaged AppImage
        run: |
          test_name=egui_app::appimage_icon::tests::packaged_appimage_contains_drill_icon
          cargo test --locked --bin drill --features verify-packaged-appimage "$test_name" -- --ignored --exact | tee "$RUNNER_TEMP/appimage-test"
          grep -Fx "test $test_name ... ok" "$RUNNER_TEMP/appimage-test"
      - name: Double-click AppImage results with Xed and Nemo
        timeout-minutes: 8
        run: |
          docker run --rm --volume "$PWD/scripts/test-appimage-open.sh:/test.sh:ro" \
            --volume "$PWD/dist/Drill-linux-x86_64.AppImage:/Drill.AppImage:ro" \
            archlinux:base bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed xed nemo xorg-server-xvfb xorg-xauth openbox xdotool wmctrl xdg-utils libxkbcommon-x11 mesa ttf-dejavu
              useradd -m tester
              install -d -m 700 -o tester /tmp/drill-session
              runuser -u tester -- env XDG_RUNTIME_DIR=/tmp/drill-session \
                xvfb-run -a dbus-run-session -- bash /test.sh /Drill.AppImage
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drill-linux
          path: dist/*
          if-no-files-found: error
  windows-cross:
    needs: platforms
    if: needs.platforms.outputs.windows == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: x86_64-pc-windows-gnu
          components: rustfmt
      - if: needs.platforms.outputs.linux != 'true'
        run: cargo fmt --all -- --check
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip file icoutils llvm lld
      - name: Check resource compiler overrides across Windows toolchains
        run: |
          rustc --edition=2021 build.rs -o "$RUNNER_TEMP/drill-resource-build"
          export OUT_DIR="$RUNNER_TEMP" CARGO_CFG_TARGET_OS=windows
          RC=x86_64-w64-mingw32-windres TARGET=x86_64-pc-windows-msvc "$RUNNER_TEMP/drill-resource-build"
          RC=llvm-rc TARGET=x86_64-pc-windows-gnu "$RUNNER_TEMP/drill-resource-build"
          for resource in "$OUT_DIR/drill-icon.o" "$OUT_DIR/drill.res"; do
            lld-link /dll /noentry /machine:x64 "/out:$resource.dll" "$resource"
            wrestool --list --type=14 "$resource.dll" | grep -- '--name=1'
          done
      - name: Cross-compile the Windows app and its UI test executable
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --target x86_64-pc-windows-gnu
          cargo test --no-run --locked --release --target x86_64-pc-windows-gnu -p drill --bin drill \
            --message-format=json-render-diagnostics > "$RUNNER_TEMP/windows-ui-build.jsonl"
          test_exe=$(jq -ers 'map(select(.reason == "compiler-artifact" and .target.name == "drill" and .profile.test and .executable))
            | select(length == 1) | .[0].executable' "$RUNNER_TEMP/windows-ui-build.jsonl")
          cp -- "$test_exe" "$RUNNER_TEMP/drill-ui-tests.exe"
          x86_64-w64-mingw32-gcc -Wall -Wextra -Werror crates/drill-windows/tests/menu_accessibility.c \
            crates/drill-windows/src/menu.c -o "$RUNNER_TEMP/drill-menu-accessibility.exe" \
            -lcomctl32 -lgdi32 -loleacc -loleaut32 -lole32 -luuid
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drill-windows-ui-tests
          path: |
            ${{ runner.temp }}/drill-ui-tests.exe
            ${{ runner.temp }}/drill-menu-accessibility.exe
          if-no-files-found: error
          retention-days: 1
      - name: Install Wine test dependencies
        run: sudo apt-get install -y --no-install-recommends wine wine64 xvfb xauth openbox xdotool wmctrl libgl1 libgl1-mesa-dri libglx-mesa0
      - name: Open the Windows app under Wine
        run: scripts/test-wine-linux.sh
      - name: Package and inspect Windows executable
        run: |
          mkdir -p dist build/windows/licenses/emoji
          cp target/x86_64-pc-windows-gnu/release/drill.exe build/windows/Drill.exe
          file build/windows/Drill.exe | grep -q 'PE32+'
          cp LICENSE build/windows/
          cp src/assets/emoji/{NOTICE,LICENSE-TWEMOJI,LICENSE-UNICODE} build/windows/licenses/emoji/
          (cd build/windows && zip -q ../../dist/Drill-windows-x86_64.zip Drill.exe LICENSE licenses/emoji/*)
          unzip -t dist/Drill-windows-x86_64.zip
          unzip -p dist/Drill-windows-x86_64.zip Drill.exe > build/windows/packaged.exe
          wrestool --extract --type=14 --name=1 build/windows/packaged.exe > build/windows/embedded.ico
          mkdir -p build/windows/{original,embedded}
          icotool -x -o build/windows/original/ src/assets/drill.ico
          cp build/windows/embedded.ico build/windows/drill.ico
          icotool -x -o build/windows/embedded/ build/windows/drill.ico
          diff -r build/windows/original build/windows/embedded
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drill-windows
          path: dist/*
          if-no-files-found: error
  windows-ui:
    needs: windows-cross
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drill-windows-ui-tests
      - name: Read menu names through Windows accessibility in light and dark mode
        run: .\drill-menu-accessibility.exe
      - name: Verify clipboard, emoji, shell initialization and file-type icons on native Windows
        shell: pwsh
        run: |
          $tests = @(
            'result_date::tests::windows_results_follow_historical_daylight_saving_rules',
            'ui_tests::windows_clipboard_preserves_shortcuts_and_write_order',
            'ui_tests::emoji_filenames_paint_colored_clusters_inside_their_columns',
            'shell_worker_balances_sta_after_failed_action',
            'icon_sample::tests::owns_only_the_file_it_created',
            'icon_sample::tests::associated_icons_match_direct_native_lookup'
          )
          foreach ($name in $tests) {
            $test = "egui_app::$name"
            & .\drill-ui-tests.exe $test --exact --color never | Tee-Object -Variable result
            if ($LASTEXITCODE -ne 0 -or $result -cnotcontains "test $test ... ok") {
              throw "The native Windows test $test did not pass."
            }
          }
  macos:
    name: macOS Swift app
    needs: platforms
    if: needs.platforms.outputs.macos == 'true'
    outputs:
      stage-id: ${{ steps.stage.outputs.artifact-id }}
      stage-sha256: ${{ steps.digest.outputs.sha256 }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - if: needs.platforms.outputs.linux != 'true'
        run: cargo fmt --all -- --check
      - name: Check the Rust packages used by the macOS app
        run: |
          packages=(-p drill-swift -p drill-core -p drill-query -p drill-icons)
          cargo clippy --locked "${packages[@]}" --all-targets --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks
          cargo test --locked "${packages[@]}"
      - name: Drive the native macOS window
        run: make test-swift-ui
      - name: Build and verify the macOS app and installer
        run: |
          make package-macos
          version=$(cargo metadata --locked --no-deps --format-version=1 | jq -er '.packages[] | select(.name == "drill") | .version')
          test "$(target/swift-ui/Drill.app/Contents/MacOS/Drill --version)" = "Drill $version"
          test "$(cargo run --locked --release -p drill -- --version)" = "Drill $version"
      - name: Hash the tested writable disk image
        if: needs.platforms.outputs.release == 'true'
        id: digest
        run: echo "sha256=$(shasum -a 256 build/Drill-stage.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Save the tested disk image for production signing
        id: stage
        if: needs.platforms.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drill-macos-stage
          path: build/Drill-stage.dmg
          if-no-files-found: error
      - name: Upload the ad-hoc-signed macOS DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drill-macos-preview
          path: dist/Drill-macos-*.dmg
          if-no-files-found: error
  macos-legacy:
    name: macOS egui comparison checks
    needs: platforms
    if: needs.platforms.outputs.macos_legacy == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - run: cargo clippy --locked -p drill -p drill-macos --all-targets --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks
      - run: cargo test --locked -p drill -p drill-macos --features macos-egui
      - name: Verify clipboard text and RGBA on a private macOS pasteboard
        run: scripts/test-macos-clipboard.sh
      - name: Verify native OpenGL rendering, resize and viewport teardown
        run: cargo run --locked -p drill --features macos-egui --example macos_opengl
  merged-main:
    needs: platforms
    if: >-
      needs.platforms.outputs.release == 'true' &&
      github.repository == 'yatima1460/Drill' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !github.event.forced && !github.event.created && !github.event.deleted &&
      github.event.after == github.sha
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
      contents: read
    outputs:
      eligible: ${{ steps.merge.outputs.eligible }}
    steps:
      - name: Match the pushed commit to a merged PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for delay in 0 5 15 30; do
            sleep "$delay"
            matched=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
              jq -r --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
                'any(.[][]; .merged_at != null and .base.repo.full_name == $repo and
                      .base.ref == "main" and .merge_commit_sha == $sha)')
            if [[ "$matched" == true ]]; then break; fi
          done
          echo "Merged main PR for $GITHUB_SHA: $matched"
          echo "eligible=$matched" >> "$GITHUB_OUTPUT"
  sign-macos:
    needs: [merged-main, jscpd, linux, windows-cross, windows-ui, macos]
    if: >-
      needs.merged-main.outputs.eligible == 'true' && needs.macos.outputs.stage-id != '' &&
      (github.run_attempt == 1 || github.triggering_actor == 'yatima1460')
    environment: prod
    outputs:
      signed-id: ${{ steps.signed.outputs.artifact-id }}
      dmg-sha256: ${{ steps.notarized.outputs.sha256 }}
      dmg-name: ${{ steps.notarized.outputs.filename }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.macos.outputs.stage-id }}
          merge-multiple: true
          path: build
      - name: Verify the tested writable disk image
        env:
          EXPECTED_SHA256: ${{ needs.macos.outputs.stage-sha256 }}
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  build/Drill-stage.dmg\n' "$EXPECTED_SHA256" | shasum -a 256 --check
      - name: Sign and notarize the production DMG
        id: notarized
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          scripts/sign-macos.sh
          filename="Drill-macos-$(uname -m).dmg"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "dist/$filename" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: signed
        with:
          name: drill-macos-signed
          path: dist/${{ steps.notarized.outputs.filename }}
          if-no-files-found: error
  release:
    needs: [sign-macos]
    if: success() && needs.sign-macos.outputs.signed-id != '' && (github.run_attempt == 1 || github.triggering_actor == 'yatima1460')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for all platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-release-artifacts.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drill-linux
          path: dist/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.signed-id }}
          merge-multiple: true
          path: dist/macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drill-windows
          path: dist/windows
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          DMG_NAME: ${{ needs.sign-macos.outputs.dmg-name }}
          EXPECTED_SHA256: ${{ needs.sign-macos.outputs.dmg-sha256 }}
        run: |
          [[ "$DMG_NAME" =~ ^Drill-macos-(arm64|x86_64)\.dmg$ && "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_SHA256" "dist/macos/$DMG_NAME" | sha256sum --check
          gh release create "rust-release-${RUN_ID}-${RUN_ATTEMPT}" dist/linux/*.deb dist/linux/*.AppImage dist/linux/*.pkg.tar.zst "dist/macos/$DMG_NAME" dist/windows/*.zip --target "$COMMIT_SHA" --title "Rust release ${RUN_NUMBER}" --generate-notes
