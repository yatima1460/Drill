name: Rust builds and releases
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev libxkbcommon-x11-0 libx11-xcb1 libegl1 xdg-utils shellcheck zstd xvfb xauth openbox xdotool
      - name: Check shell scripts
        run: |
          shellcheck scripts/*.sh 'Start Drill.command' 'Run UI Tests.command' 'Run Core Tests.command'
          for script in scripts/*.sh 'Start Drill.command' 'Run UI Tests.command' 'Run Core Tests.command'; do bash -n "$script"; done
      - name: Verify isolated icon decoder
        run: |
          cargo fmt --manifest-path tools/exe-icon-wasm/Cargo.toml -- --check
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/registry/src=/cargo/registry/src --remap-path-prefix=$PWD=/workspace"
          cargo build --manifest-path tools/exe-icon-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked
          cmp src/assets/exe-icon.wasm tools/exe-icon-wasm/target/wasm32-unknown-unknown/release/drill_exe_icon_wasm.wasm
      - name: Preserve decoder rebuild on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: decoder-rebuild
          path: tools/exe-icon-wasm/target/wasm32-unknown-unknown/release/drill_exe_icon_wasm.wasm
          if-no-files-found: ignore
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks
      - run: cargo test --locked --workspace
      - name: Native UI test on a virtual X display
        run: xvfb-run -a scripts/test-native-ui-linux.sh
      - run: cargo build --release --locked
      - run: target/release/drill --version
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drill-linux
          path: dist/*
          if-no-files-found: error
  windows-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip file
      - name: Cross-compile Windows executable
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: Install Wine test dependencies
        run: sudo apt-get install -y --no-install-recommends wine wine64 xvfb xauth openbox xdotool wmctrl libgl1 libgl1-mesa-dri libglx-mesa0
      - name: Open the Windows app under Wine
        run: scripts/test-wine-linux.sh
      - name: Package and inspect Windows executable
        run: |
          mkdir -p dist build/windows
          cp target/x86_64-pc-windows-gnu/release/drill.exe build/windows/Drill.exe
          file build/windows/Drill.exe | grep -q 'PE32+'
          cp LICENSE build/windows/
          (cd build/windows && zip -q ../../dist/Drill-windows-x86_64.zip Drill.exe LICENSE)
          unzip -t dist/Drill-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: drill-windows
          path: dist/*
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drill-macos
          path: dist/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, windows-cross, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for all platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-release-artifacts.sh
      - uses: actions/download-artifact@v4
        with:
          name: drill-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: drill-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: drill-windows
          path: dist
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: gh release create "rust-release-${RUN_ID}-${RUN_ATTEMPT}" dist/* --target "$COMMIT_SHA" --title "Rust release ${RUN_NUMBER}" --generate-notes
