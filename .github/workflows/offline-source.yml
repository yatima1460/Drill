name: Offline source bundle
on:
  pull_request:
    paths:
      - 'scripts/package-offline-source.sh'
      - '.github/workflows/offline-source.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned compiler, Wasm target and Linux SDKs
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Package and relocate the source
        run: |
          archive=$(scripts/package-offline-source.sh)
          mkdir "$RUNNER_TEMP/relocated"
          tar -xzf "$archive" -C "$RUNNER_TEMP/relocated"
          source_dir="$RUNNER_TEMP/relocated/Drill-source-$(git rev-parse HEAD)"
          while IFS= read -r -d '' file; do
            cmp -- "$file" "$source_dir/$file"
          done < <(git ls-files -z)
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
      - name: Rebuild from an empty Cargo home with networking disabled
        run: |
          compiler_bin=$(dirname "$(rustup which rustc)")
          cargo_home=$(mktemp -d)
          target=$(mktemp -d)
          cd "$SOURCE_DIR"
          sudo unshare --net -- sudo -u "$(id -un)" env \
            PATH="$compiler_bin:$PATH" CARGO_HOME="$cargo_home" CARGO_TARGET_DIR="$target" CARGO_BUILD_BUILD_DIR="$target" \
            bash -euo pipefail -c '
              cargo build --frozen --release --bin drill
              "$CARGO_TARGET_DIR/release/drill" --version
              cargo metadata --frozen --format-version 1 --manifest-path verification/Cargo.toml > /dev/null
              registry=/cargo/registry/src/index.crates.io-1949cf8c6b5b557f
              export CARGO_ENCODED_RUSTFLAGS
              CARGO_ENCODED_RUSTFLAGS=$(printf -- "--remap-path-prefix=%s=/workspace\037--remap-path-prefix=%s/cargo-sources=%s" "$PWD" "$PWD" "$registry")
              for decoder in exe-icon appimage-icon; do
                cargo build --frozen --release --target wasm32-unknown-unknown --manifest-path "tools/$decoder-wasm/Cargo.toml"
                wasm="drill_${decoder//-/_}_wasm.wasm"
                cmp "src/assets/$decoder.wasm" "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/$wasm"
              done
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Drill-offline-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/Drill-source-*.tar.gz
          compression-level: 0
          if-no-files-found: error
