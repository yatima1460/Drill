<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://github.com; connect-src https://api.github.com; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Drill is a very fast desktop file searcher without indexing. Multithreaded, heuristic-first, and built for modern NVMe-era hardware."
    />
    <title>Drill | File and app search</title>
    <link rel="icon" type="image/svg+xml" href="drill.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="alternate" type="application/atom+xml" title="Drill releases" href="https://github.com/yatima1460/Drill/releases.atom" />
    <script defer src="releases.js"></script>
  </head>
  <body>
    <div class="page-backdrop" aria-hidden="true"></div>

    <header class="hero" id="top">
      <section class="hero-content">
        <div class="title-row">
          <img class="brand-mark" src="drill.svg" alt="" aria-hidden="true" />
          <h1>Drill</h1>
        </div>
        <p class="hero-copy">Search files and apps without indexing.</p>
        <p class="release-date" id="release-date"><a href="https://github.com/yatima1460/Drill/releases/latest">Latest release</a></p>
        <p class="release-feed"><a type="application/atom+xml" href="https://github.com/yatima1460/Drill/releases.atom">Subscribe to the release feed</a></p>
        <div class="hero-actions" id="release-actions">
          <div class="download-group-actions">
            <a class="btn btn-primary" href="https://github.com/yatima1460/Drill/releases/latest">Download latest release</a>
            <a class="btn btn-primary btn-with-icon" id="aur-download" href="https://aur.archlinux.org/packages/drill-search" target="_blank" rel="noopener noreferrer">
              <img class="os-icon-img" src="arch-linux-logo.svg" alt="" /> AUR (legacy Python)
            </a>
          </div>
        </div>
      </section>

      <figure class="app-shot">
        <img src="screenshot.png" alt="Drill app window showing search results" />
      </figure>
    </header>

    <footer class="footer">
      <div class="footer-links">
        <a
          class="btn btn-secondary btn-with-icon"
          href="https://github.com/yatima1460/Drill"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span>GitHub</span>
        </a>
        <a href="https://github.com/yatima1460/Drill" target="_blank" rel="noopener noreferrer"
          >github.com/yatima1460/Drill</a
        >
      </div>
      <div class="footer-tagline">
        <a href="https://yatima.me" target="_blank" rel="noopener noreferrer">Made with ♥ by yatima</a>
      </div>
      <div class="footer-badge">
        <a
          href="https://github.com/yatima1460/Drill/actions/workflows/rust.yml"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Rust build and release status on main"
        >
          <img
            src="https://github.com/yatima1460/Drill/actions/workflows/rust.yml/badge.svg?branch=main"
            alt="Rust build and release status on main"
          />
        </a>
      </div>
    </footer>

  </body>
</html>
