[package]
name = "drill-appimage-icon-wasm"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
lamfold = { version = "0.1.5", default-features = false }
lamfold-iso = { version = "0.1.2", default-features = false, features = ["zisofs"] }
lamfold-squash = { version = "0.1.1", default-features = false, features = ["gzip", "xz", "zstd", "lz4", "lzo"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
resvg = { version = "0.50.0", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
